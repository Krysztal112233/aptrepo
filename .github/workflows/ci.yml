name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check "**/*.ts"

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check scripts/*.ts packages/*/build.ts

      - name: Validate config
        run: ./scripts/check-config.ts
