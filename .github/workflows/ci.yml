name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Hermetic build tests
        run: deno test --allow-env --allow-read --allow-write --allow-run scripts/*_test.ts

      - name: Format
        run: deno fmt --check "**/*.ts"

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check scripts/*.ts packages/*/build.ts

      - name: Validate config
        run: ./scripts/check-config.ts
