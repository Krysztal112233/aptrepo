[package]
name = "typst"
version = "0.15.1"
debian_revision = "1"

# NOTE (check-updates): typst has legacy date-based tags (e.g. v23-03-28)
# that version-sort above the current v0.x scheme, so update candidates must
# be verified against https://github.com/typst/typst/releases before bumping.
[source]
git = "https://github.com/typst/typst"
tag = "v{version}"
archive = "{git}/archive/refs/tags/{tag}.tar.gz"
archive_root = "typst-{version}"
sha256 = "c07909e01a2a6941e52c9b616e48c209c755eed416d62bcf5583c37a4aca01a3"

[build]
toolchain = "rust"
